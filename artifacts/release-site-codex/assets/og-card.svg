<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Weft — evidence-backed handoffs between AI agent hosts</title>
  <style>
    /* Resolved relative to this file, so the rendered PNG uses the real faces. */
    @font-face {
      font-family: 'Archivo';
      font-style: normal; font-weight: 100 900; font-stretch: 62% 125%;
      src: url('fonts/archivo-var-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      font-style: normal; font-weight: 400;
      src: url('fonts/plex-mono-400-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      font-style: normal; font-weight: 500;
      src: url('fonts/plex-mono-500-latin.woff2') format('woff2');
    }
    .brand { font-family: Archivo, sans-serif; font-size: 24px; font-weight: 600; font-stretch: 82%; }
    .stmt  { font-family: Archivo, sans-serif; font-size: 62px; font-weight: 500; font-stretch: 100%; letter-spacing: -1px; }
    .mono  { font-family: 'IBM Plex Mono', monospace; font-size: 16px; letter-spacing: 2.4px; }
    .head  { font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 3px; fill: #94908A; }
    .entry { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; }
    .ink-ground { fill: #10201A; }
  </style>

  <!-- ground, credit paper, and the one rule at 37% -->
  <rect width="1200" height="630" fill="#10201A"/>
  <rect x="444" width="756" height="630" fill="#16291F"/>
  <rect x="444" width="1" height="630" fill="#E8E3D4" fill-opacity=".38"/>

  <!-- brand -->
  <rect x="72" y="56" width="30" height="30" fill="#E8E3D4"/>
  <text class="ink-ground" x="87" y="79" font-family="Archivo, sans-serif" font-size="20" font-weight="700" font-stretch="90%" text-anchor="middle">f</text>
  <text class="brand" x="114" y="79" fill="#E8E3D4">weft</text>
  <rect y="118" width="1200" height="1" fill="#E8E3D4" fill-opacity=".22"/>

  <!-- the statement, straddling the rule -->
  <text class="stmt" x="72" y="242" fill="#E8E3D4">One incident.</text>
  <text class="stmt" x="72" y="308" fill="#E8E3D4">Two agents.</text>
  <text class="stmt" x="72" y="374" fill="#E8E3D4">One account of</text>
  <text class="stmt" x="72" y="440" fill="#E8E3D4">what happened.</text>

  <!-- column heads -->
  <text class="head" x="72" y="500">ASSERTED</text>
  <text class="head" x="478" y="500">PROVED</text>

  <!-- two posted entries then one unposted, so all three states read at a glance -->
  <rect y="516" width="1200" height="1" fill="#E8E3D4" fill-opacity=".22"/>
  <text class="entry" x="72" y="544" fill="#E8E3D4">9 documented paths</text>
  <text class="entry" x="478" y="544" fill="#94908A">MCP host evidence on file</text>

  <rect y="558" width="1200" height="1" fill="#E8E3D4" fill-opacity=".22"/>
  <text class="entry" x="72" y="586" fill="#E8E3D4">0 live validations</text>
  <text class="entry" x="478" y="586" fill="#94908A">host-pair proof still open</text>

  <rect y="600" width="1200" height="1" fill="#C7382B"/>
  <text class="mono" x="72" y="622" fill="#F0705A">MCP · v0.1.0 · SINGLE-NODE PREVIEW</text>
</svg>
