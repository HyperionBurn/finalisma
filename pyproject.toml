[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weft-mcp"
version = "0.1.0"
description = "A dependency-free MCP bridge for reliable agent-to-agent teams."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Weft" }]
dependencies = []

[project.scripts]
weft-mcp = "weft_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["weft_mcp*", "weft_sdk*", "weft_cloud*"]

[tool.weft]
protocol = "weft.a2a/1.0"
mcp_protocol = "2025-11-25"
