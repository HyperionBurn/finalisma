<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Weft — DOUBLE ENTRY visual target, 1440 × 900</title>
  <desc>The page is a ledger. One hard vertical rule at 37% runs the full height: left of it is asserted, right of it is proved. Two inks on one ground, and red means an unposted entry rather than emphasis.</desc>

  <style>
    /* The same self-hosted faces as the site, resolved relative to this file,
       so the comparison artifact measures craft and not font fallback. */
    @font-face {
      font-family: 'Archivo';
      font-style: normal; font-weight: 100 900; font-stretch: 62% 125%;
      src: url('assets/fonts/archivo-var-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      font-style: normal; font-weight: 400;
      src: url('assets/fonts/plex-mono-400-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      font-style: normal; font-weight: 500;
      src: url('assets/fonts/plex-mono-500-latin.woff2') format('woff2');
    }
    text { fill: #E8E3D4; }
    .label   { font-family: Archivo, sans-serif; font-size: 138px; font-weight: 700; font-stretch: 68%; letter-spacing: -1.4px; }
    .stmt    { font-family: Archivo, sans-serif; font-size: 60px; font-weight: 500; font-stretch: 100%; letter-spacing: -.9px; }
    .brand   { font-family: Archivo, sans-serif; font-size: 17px; font-weight: 600; font-stretch: 82%; }
    .mono    { font-family: 'IBM Plex Mono', monospace; font-size: 15px; }
    .mono-md { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; }
    .mono-sm { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px; fill: #94908A; }
    .btn     { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 1.4px; }
    .dim     { fill: #94908A; }
    .red     { fill: #F0705A; }
    .ink-ground { fill: #10201A; }
  </style>

  <!-- ground -->
  <rect width="1440" height="900" fill="#10201A"/>
  <!-- credit paper: the second sheet, right of the rule -->
  <rect x="532.8" width="907.2" height="900" fill="#16291F"/>
  <!-- THE rule: one hairline at 37%, full height, never broken -->
  <rect x="532.8" width="1" height="900" fill="#E8E3D4" fill-opacity=".38"/>

  <!-- topbar -->
  <text class="mono-sm" x="72" y="25">INTEROP PROFILE 0.1 PREVIEW</text>
  <text class="mono-sm" x="567" y="25">RECRUITING 8 DESIGN PARTNERS · HOST VALIDATION OPEN</text>
  <rect y="40" width="1440" height="1" fill="#E8E3D4" fill-opacity=".22"/>

  <!-- header -->
  <rect x="61" y="61" width="22" height="22" fill="#E8E3D4"/>
  <text class="brand ink-ground" x="72" y="79" text-anchor="middle" font-weight="700">f</text>
  <text class="brand" x="93" y="79">weft</text>
  <text class="mono-sm" x="567" y="77">PROBLEM     ENTRIES     DEMO     COMPATIBILITY     FAQ</text>
  <rect x="1251" y="55" width="117" height="34" fill="none" stroke="#E8E3D4" stroke-opacity=".38"/>
  <text class="btn" x="1266" y="76">COHORT FIT</text>
  <rect y="104" width="1440" height="1" fill="#E8E3D4" fill-opacity=".22"/>

  <!-- folio label, ruled off the right edge -->
  <text class="label" x="72" y="262">00 — INCIDENT ACCOUNT</text>
  <rect x="810" y="245" width="630" height="2" fill="#E8E3D4" fill-opacity=".38"/>

  <!-- the statement: the one line allowed to straddle the rule -->
  <text class="stmt" x="72" y="368">One incident.</text>
  <text class="stmt" x="72" y="430">Two agents.</text>
  <text class="stmt" x="72" y="492">One account of</text>
  <text class="stmt" x="72" y="554">what happened.</text>

  <!-- column heads: the document is labelled once, at the top -->
  <text class="mono-sm" x="72" y="690">ASSERTED</text>
  <text class="mono-sm" x="567" y="690">PROVED</text>

  <!-- debit column -->
  <text class="mono" x="72" y="732">When one agent stalls,</text>
  <text class="mono" x="72" y="760">hand a bounded incident</text>
  <text class="mono" x="72" y="788">question to a second host</text>
  <text class="mono dim" x="72" y="816">without losing the record.</text>
  <rect x="72" y="840" width="180" height="40" fill="#E8E3D4"/>
  <text class="btn ink-ground" x="92" y="865">RUN THE PROOF</text>
  <rect x="268" y="840" width="190" height="40" fill="none" stroke="#E8E3D4" stroke-opacity=".38"/>
  <text class="btn" x="288" y="865">CHECK COHORT FIT</text>

  <!-- credit column: entries straddling the rule, all three states shown -->
  <rect y="710" width="1440" height="1" fill="#E8E3D4" fill-opacity=".22"/>
  <text class="mono-md" x="567" y="738">9 documented MCP paths</text>
  <text class="mono dim" x="567" y="764">compatibility evidence on file</text>

  <rect y="788" width="1440" height="1" fill="#E8E3D4" fill-opacity=".22"/>
  <text class="mono-md" x="567" y="816">0 live Weft validations</text>
  <text class="mono dim" x="567" y="842">first proof pair: Codex + Claude Code</text>

  <!-- an unposted entry: red ink AND the word, never colour alone -->
  <rect y="866" width="1440" height="1" fill="#C7382B"/>
  <text class="mono-md red" x="567" y="894">host-pair proof pending</text>
  <text class="mono red" x="1180" y="894">—  unposted</text>
</svg>
