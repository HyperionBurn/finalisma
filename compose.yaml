# Finalisma Cloud — local stack.
#
# One command brings up the hosted SaaS surface with a persistent named volume
# for the SQLite database:
#
#     docker compose up -d --build
#
# TWO PROCESSES, ONE STORE: the agent-facing API (finalisma-cloud) and the
# browser front-end (finalisma-web) are separate containers from the same
# image, and BOTH open the SAME SQLite database file (/data/finalisma-cloud.db)
# in WAL mode. SQLite-WAL supports many concurrent readers and exactly ONE
# writer, so the single-writer constraint now spans both processes: each
# service must run as a single instance, the two must share one persistent
# disk, and neither may be scaled behind a load balancer. See docs/DEPLOY.md.
#
# The marketing site (site/, web/) is deliberately NOT part of this stack: it is
# static content served separately for preview and is not part of the SaaS
# backend. The image does NOT carry the built site, so the web container leaves
# WEFT_WEB_STATIC_DIR unset and serves no static files.
#
# No secrets live here. All configuration comes from the environment, and the
# defaults in this file contain nothing secret.

services:
  finalisma-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: finalisma-cloud:local
    ports:
      - "127.0.0.1:18788:18788"
    environment:
      WEFT_HOST: "0.0.0.0"
      WEFT_PORT: "18788"
      WEFT_DB_PATH: "/data/finalisma-cloud.db"
    volumes:
      - finalisma-cloud-data:/data
    restart: unless-stopped

  # Browser front-end: signup/login/rooms over the SAME database the agent API
  # uses. A second container from the same image; the default CMD stays the
  # cloud service, this service overrides it to the web entry point. Both
  # containers mount the same named volume and point at the same SQLite file,
  # which is safe only because both open it in WAL mode (one writer, many
  # readers). The image's baked-in HEALTHCHECK probes WEFT_PORT/healthz,
  # which nothing in this container listens on, so it is overridden here to
  # probe the web port; GET /login returns 200 without a session.
  finalisma-web:
    image: finalisma-cloud:local
    command: ["python", "-B", "-m", "weft_cloud.web"]
    ports:
      - "127.0.0.1:18789:18789"
    environment:
      WEFT_WEB_HOST: "0.0.0.0"
      WEFT_WEB_PORT: "18789"
      WEFT_WEB_DB_PATH: "/data/finalisma-cloud.db"
      WEFT_WEB_STATE_DIR: "/data"
    volumes:
      - finalisma-cloud-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('WEFT_WEB_PORT','18789')+'/login', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  # State survives container rebuilds and `docker compose down`. Only
  # `docker compose down -v` (or an explicit `docker volume rm`) destroys it.
  finalisma-cloud-data:
